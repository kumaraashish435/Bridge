<div class="min-h-screen bg-black text-white p-6">

  <h1 class="text-2xl mb-6">📊 Document Insights</h1>

  <!-- No Data -->
  <div *ngIf="!result" class="text-gray-400">
    No data available.
  </div>

  <!-- MAIN RESULT -->
  <div *ngIf="result?.data" class="space-y-6">

    <!-- TOP CARDS -->
    <div class="grid grid-cols-2 gap-4">

      <div class="bg-zinc-800 p-4 rounded-xl">
        <p class="text-gray-400 text-sm">Document Type</p>
        <p class="text-lg font-semibold">
          {{ result.data.document_type || 'N/A' }}
        </p>
      </div>

      <div class="bg-zinc-800 p-4 rounded-xl">
        <p class="text-gray-400 text-sm">Title</p>
        <p class="text-lg font-semibold">
          {{ result.data.title || 'N/A' }}
        </p>
      </div>

    </div>

    <!-- TABLE SECTION -->
    <div class="bg-zinc-900 p-4 rounded-xl">

      <h2 class="mb-4 text-lg">📋 Extracted Data</h2>

      <!-- If data exists -->
      <div *ngIf="result.data.data?.length > 0; else noData">

        <div class="overflow-auto max-h-[450px] border border-zinc-800 rounded">

          <table class="w-full text-sm">

            <thead class="sticky top-0 bg-zinc-900">
              <tr class="border-b border-gray-700 text-gray-400">
                <th 
                  *ngFor="let key of objectKeys(result.data.data[0])"
                  class="p-3 text-left"
                >
                  {{ key }}
                </th>
              </tr>
            </thead>

            <tbody>
              <tr 
                *ngFor="let row of result.data.data"
                class="border-b border-gray-800 hover:bg-zinc-800 transition"
              >
                <td 
                  *ngFor="let key of objectKeys(row)"
                  class="p-3"
                >
                  {{ row[key] }}
                </td>
              </tr>
            </tbody>

          </table>

        </div>

      </div>

      <!-- No Data -->
      <ng-template #noData>
        <p class="text-gray-400">No structured rows found.</p>
      </ng-template>

    </div>

    <!-- RAW JSON (OPTIONAL DEBUG) -->
    <div class="bg-zinc-800 p-4 rounded">
      <p class="text-sm text-gray-400 mb-2">Raw Output</p>
      <pre class="text-xs overflow-auto max-h-40">
{{ result.data | json }}
      </pre>
    </div>

  </div>

</div>
