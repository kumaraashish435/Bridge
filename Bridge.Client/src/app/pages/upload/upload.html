<div class="min-h-screen bg-black text-white flex items-center justify-center px-4">

  <div class="bg-zinc-900 p-8 rounded-2xl shadow-xl w-full max-w-xl border border-zinc-800">

    <h1 class="text-2xl font-semibold mb-6 text-center">
      🚀 Vision AI Extractor
    </h1>

    <!-- File Input -->
    <div class="mb-4">
      <input 
        type="file" 
        (change)="onFileSelected($event)"
        class="w-full p-3 bg-zinc-800 border border-zinc-700 rounded-lg cursor-pointer text-sm"
      />

      <!-- File Name -->
      <p *ngIf="selectedFile" class="text-xs text-gray-400 mt-2">
        Selected: {{ selectedFile.name }}
      </p>
    </div>

    <!-- Upload Button -->
    <button 
      (click)="upload()" 
      [disabled]="loading || !selectedFile"
      class="w-full py-2 rounded-lg transition font-medium
             bg-white text-black hover:bg-gray-300
             disabled:opacity-50 disabled:cursor-not-allowed"
    >
      {{ loading ? 'Processing...' : 'Upload & Analyze' }}
    </button>

    <!-- Loading -->
    <div *ngIf="loading" class="mt-4 text-center text-gray-400 animate-pulse">
      ⏳ Analyzing document with AI...
    </div>

    <!-- Success -->
    <div *ngIf="result && !loading" class="text-green-400 mt-4 text-center">
      ✅ Extraction Complete
    </div>

    <!-- Result -->
    <div *ngIf="result" class="mt-6">

      <h2 class="text-lg mb-3">📊 Extracted Data</h2>

      <div class="bg-black p-4 rounded-lg max-h-64 overflow-auto text-sm border border-zinc-800">
        <pre class="whitespace-pre-wrap break-words">
{{ result | json }}
        </pre>
      </div>

    </div>

  </div>

</div>
