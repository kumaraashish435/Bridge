<div class="min-h-screen bg-black text-white flex items-center justify-center">

  <div class="bg-zinc-900 p-8 rounded-2xl shadow-lg w-full max-w-xl">

    <h1 class="text-2xl font-semibold mb-6 text-center">
      📄 Vision PDF Extractor
    </h1>

    <!-- File Input -->
    <div class="mb-4">
      <input 
        type="file" 
        (change)="onFileSelected($event)"
        class="w-full p-2 bg-zinc-800 border border-zinc-700 rounded-lg cursor-pointer"
      />
    </div>

    <!-- Upload Button -->
    <button 
      (click)="upload()" 
      class="w-full bg-white text-black py-2 rounded-lg hover:bg-gray-300 transition"
    >
      Upload & Process
    </button>

    <!-- Loading -->
    <div *ngIf="loading" class="mt-4 text-center text-gray-400">
      ⏳ Processing your file...
    </div>
    <div *ngIf="result" class="text-green-400 mt-2 text-center">
    ✅ Processing Complete
    </div>

    <!-- Result -->
    <div *ngIf="result" class="mt-6">
      <h2 class="text-lg mb-2">📊 Result</h2>
      <div class="bg-black p-3 rounded-lg max-h-60 overflow-auto text-sm">
        <pre>{{ result  }}</pre>
      </div>
    </div>

  </div>

</div>
